<text class="ts" x="470" y="100">botão centrado no topo da tampa (de -10 a 7):</text>
<text class="ts" x="470" y="117">  7,2 de largura, crista 3,0 acima da tampa,</text>
<text class="ts" x="470" y="134">  abas 1,2 acima da tampa</text>
<text class="ts" x="470" y="151">o rasgo da tampa fica todo debaixo do botão:</text>
<text class="ts" x="470" y="168">  1,0 de sobra do lado de fora, 1,6 do de dentro</text>
<text class="ts" x="470" y="185">na pele da tampa a haste afina (pescoço),</text>
<text class="ts" x="470" y="202">  e o resto da haste segue rente à lingueta</text>
<text class="ts" x="470" y="219">o cursor continua peça única, deitado na</text>
<text class="ts" x="470" y="236">  mesa como a v3 (lingueta, haste e botão</text>
<text class="ts" x="470" y="253">  encostados): por isso o botão só cresce</text>
<text class="ts" x="470" y="270">  para dentro desse lado</text>
<text class="th" x="20" y="443.6">2. de lado (transparente), aberta: lingueta na janela sem pernas</text>
