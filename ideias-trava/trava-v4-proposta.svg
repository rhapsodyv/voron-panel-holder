<text class="ts" x="20" y="1052">Curso 16 → 10: as pernas voltam a 45° do outro lado da janela (o clip imprime em pé pela outra ponta), então a lingueta</text>
<text class="ts" x="20" y="1070">só precisa sair da janela, Botão = 2 × curso + haste + folgas + 1,5 de sobra em cada ponta = 27,4.</text>
<text class="ts" x="20" y="1088">Montagem: a lingueta entra por cima, pelo rasgo da tampa, 1,2 mm deslocada para dentro; depois a tampa desliza no clip pela ponta.</text>
