"7" height="48" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><polygon points="73,138 64,143 73,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><polygon points="97,138 106,143 97,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/></g><line x1="58" y1="186" x2="74" y2="186" stroke="#C04828" stroke-width="1.6" marker-end="url(#a)"/><line x1="112" y1="186" x2="96" y2="186" stroke="#C04828" stroke-width="1.6" marker-end="url(#a)"/><text class="th" x="85" y="226" text-anchor="middle">2. empurra o painel</text><text class="ts" x="85" y="244" text-anchor="middle">as pernas se apertam e entram</text></g><g transform="translate(485,40)"><polygon points="5,120 71,120 71,136 45,136 45,180 125,180 125,136 99,136 99,120 165,120 165,200 5,200" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/><g transform="translate(0,0)"><rect x="5" y="88" width="160" height="32" rx="2" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="5" y="100" width="52" height="8" fill="#B5D4F4"/></g><g transform="translate(0,0)"><rect x="40" y="91" width="50" height="7" rx="3.5" fill="#7F77DD"/><rect x="74" y="89" width="12" height="11" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/></g><g transform="translate(0,0)"><rect x="73" y="120" width="7" height="48" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><rect x="90" y="120" width="7" height="48" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><polygon points="73,138 64,143 73,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><polygon points="97,138 106,143 97,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><rect x="80" y="124" width="10" height="40" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/></g><line x1="48" y1="80" x2="72" y2="80" stroke="#C04828" stroke-width="1.6" marker-end="url(#a)"/><text class="th" x="85" y="226" text-anchor="middle">3. desliza a lingueta</text><text class="ts" x="85" y="244" text-anchor="middle">uma barra entra entre as pernas</text></g><text class="ts" x="340" y="326" text-anchor="middle">Com a barra no meio, as pernas não se apertam e o clip não sai. Para tirar: desliza de volta e puxa.</text><text class="ts" x="340" y="344" text-anchor="middle">É o mesmo princípio do rebite plástico de painel de carro (o pino do meio trava as pernas).</text></svg>