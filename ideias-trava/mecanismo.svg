ht="48" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><polygon points="73,138 64,143 73,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><polygon points="97,138 106,143 97,150" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><rect x="80" y="86" width="10" height="78" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.6"/><rect x="30" y="79" width="114" height="7" rx="2" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><rect x="132" y="80" width="16" height="8" fill="#534AB7"/><circle cx="140" cy="84" r="4" fill="#0F6E56"/><line x1="40" y1="52" x2="40" y2="72" stroke="#C04828" stroke-width="1.6" marker-end="url(#a)"/><text class="th" x="85" y="226" text-anchor="middle">travado</text><text class="ts" x="85" y="244" text-anchor="middle">alavanca deitada, pino no vão</text></g><line x1="250" y1="176" x2="400" y2="176" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/><text class="ts" x="340" y="316" text-anchor="middle">Abaixar a alavanca empurra o pino para o vão entre as pernas; levantar puxa o pino de volta.</text>
<text class="tt" x="340" y="340" text-anchor="middle">C · lingueta: vista de lado, ao longo da borda</text><g transform="translate(60,346)"><rect x="5" y="130" width="160" height="70" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/><rect x="5" y="98" width="160" height="32" rx="2" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="15" y="130" width="140" height="40" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="80" y="94" width="10" height="36" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.6"/><polygon points="25,94 85,94 25,124" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><rect x="15" y="84" width="80" height="10" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><text class="th" x="85" y="226" text-anchor="middle">liberado</text><text class="ts" x="85" y="244" text-anchor="middle">rampa longe, pino fora</text></g><g transform="translate(410,346)"><rect x="5" y="130" width="160" height="70" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/><rect x="5" y="98" width="160" height="32" rx="2" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="15" y="130" width="140" height="40" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="80" y="124" width="10" height="36" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.6"/><polygon points="85,94 145,94 85,124" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><rect x="75" y="84" width="80" height="10" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.6"/><line x1="40" y1="74" x2="64" y2="74" stroke="#C04828" stroke-width="1.6" marker-end="url(#a)"/><text class="th" x="85" y="226" text-anchor="middle">travado</text><text class="ts" x="85" y="244" text-anchor="middle">rampa empurrou o pino</text></g><line x1="250" y1="490" x2="400" y2="490" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/><text class="ts" x="340" y="630" text-anchor="middle">A lingueta tem um dente com rampa por baixo: deslizando, a rampa empurra o pino para baixo.</text>
<text class="ts" x="340" y="648" text-anchor="middle">Pino no vão: as pernas não se apertam e o clip não sai. Pino fora: as pernas se apertam e o painel sai sem força.</text>
